<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Deep Dive Trivia</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Silkscreen&display=swap" rel="stylesheet">
<style>
/* VOICE: retro pixel arcade, a CRT terminal sinking into the sea
   IDEA: the screen is a camera on a krill; every point drops it 10 m
   PICTURE: scrolling ocean world: sky, boat, fish, kelp, tier lines, depth ruler, marine snow
   COLOUR and TYPE: sea blues to abyss black, cyan HUD, hot-pink actions; Silkscreen labels + JetBrains Mono
   LAYOUT: HUD on top, prompt card under it, answer bar pinned to the bottom, ruler on the right */
:root{color-scheme:dark;--cyan:#5fe3ee;--pink:#ff4f8b;--ink:#e8f1f7;--muted:#8aa3b8;--panel:rgba(10,18,32,.86);--line:#24405a}
*{box-sizing:border-box;min-width:0}
html,body{height:100%;margin:0}
body{background:#0a1220;color:var(--ink);font:15px/1.5 "JetBrains Mono",ui-monospace,monospace;overflow:hidden}
.px{font-family:Silkscreen,"JetBrains Mono",monospace;letter-spacing:.18em;text-transform:uppercase}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}
.notch{clip-path:polygon(8px 0,calc(100% - 8px) 0,100% 8px,100% calc(100% - 8px),calc(100% - 8px) 100%,8px 100%,0 calc(100% - 8px),0 8px)}
/* ---- world ---- */
#stage{position:fixed;inset:0;overflow:hidden}
#world{position:absolute;left:0;right:0;top:0;will-change:transform}
.w{position:absolute}
.sky{left:0;right:0;background:linear-gradient(#b9d9ea,#dcebf2 70%,#eef5f8)}
.sun{width:64px;height:64px;border-radius:50%;background:#ffe9a8;box-shadow:0 0 40px 20px rgba(255,233,168,.6)}
.cloud{animation:drift 60s linear infinite alternate}
@keyframes drift{to{transform:translateX(120px)}}
.surf{left:0;right:0;height:6px;background:#2a5f88}
.rays{left:0;right:0;height:900px;opacity:.28;background:repeating-linear-gradient(98deg,transparent 0 70px,rgba(190,230,255,.18) 70px 110px,transparent 110px 190px);
  -webkit-mask:linear-gradient(#000,transparent);mask:linear-gradient(#000,transparent);animation:sway 10s ease-in-out infinite alternate}
@keyframes sway{to{transform:skewX(-7deg) translateX(40px)}}
.fish{animation:swim linear infinite}
@keyframes swim{from{transform:translateX(-60px)}to{transform:translateX(calc(100vw + 60px))}}
.fish.rev{animation-name:swimr}.fish.rev svg{transform:scaleX(-1)}
@keyframes swimr{from{transform:translateX(calc(100vw + 60px))}to{transform:translateX(-60px)}}
.fact{right:72px;font-size:12px;color:rgba(200,225,240,.55);white-space:nowrap}
.fact::after{content:"";display:inline-block;width:28px;height:1px;background:currentColor;vertical-align:middle;margin-left:8px}
.tline{left:12px;right:60px;border-top:2px dashed rgba(220,235,245,.55);transition:border-color .3s,box-shadow .3s}
.tline span{position:absolute;right:0;top:-24px;font-size:12px;display:flex;align-items:center;gap:8px;white-space:nowrap}
.tline.hit{border-top-color:var(--tc);box-shadow:0 0 14px var(--tc)}
#snow{position:fixed;inset:0;width:100%;height:100%;pointer-events:none}
.scan{position:fixed;inset:0;pointer-events:none;background:repeating-linear-gradient(transparent 0 2px,rgba(0,0,0,.13) 2px 3px);mix-blend-mode:multiply;z-index:30}
.vig{position:fixed;inset:0;pointer-events:none;z-index:29;box-shadow:inset 0 0 90px 20px rgba(255,60,110,.55);opacity:0;transition:opacity .3s}
.vig.on{animation:vig 1s ease-in-out infinite}
@keyframes vig{50%{opacity:1}}
/* ---- krill ---- */
#krill{position:fixed;z-index:12;width:48px;height:42px;left:28px;top:66%;transition:left 1.4s cubic-bezier(.4,0,.2,1),top 1.4s cubic-bezier(.4,0,.2,1);filter:drop-shadow(0 0 8px rgba(255,60,90,.9))}
#krill.away{opacity:0}
#krill.gold{filter:drop-shadow(0 0 10px rgba(255,210,63,.95)) drop-shadow(0 0 22px rgba(255,210,63,.5))}
#krill.turn{animation:turngold 1s ease-out}
@keyframes turngold{0%{transform:scale(1)}30%{transform:scale(1.6);filter:brightness(2.4) drop-shadow(0 0 30px #ffd23f)}100%{transform:scale(1)}}
#krill svg{animation:bob 2.4s ease-in-out infinite;display:block}
@keyframes bob{50%{transform:translateY(-6px) rotate(-6deg)}}
/* ---- HUD ---- */
.hud{position:fixed;z-index:20;top:10px;left:10px;right:10px;display:flex;justify-content:space-between;align-items:flex-start;pointer-events:none}
.hud>*{pointer-events:auto}
.meter{background:var(--panel);padding:6px 14px 8px;min-width:96px}
.meter small{display:block;font:9px Silkscreen,monospace;letter-spacing:.25em;color:var(--muted)}
.meter b{font:700 20px "JetBrains Mono",monospace}
#depthV{color:var(--cyan)}#scoreV{color:var(--pink)}
.meter.r{text-align:right}
.mid{text-align:center}
.squares{display:flex;gap:4px;justify-content:center;flex-wrap:wrap;max-width:60vw}
.sq{width:16px;height:16px;background:#1b2a3d;border:1px solid #33506b;transition:background .4s}
.sq.now{background:var(--pink);border-color:var(--pink);animation:blinkq 1.2s steps(2) infinite}
@keyframes blinkq{50%{opacity:.55}}
.mid small{display:block;margin-top:6px;font:9px Silkscreen,monospace;letter-spacing:.3em;color:var(--muted)}
.ibtn{position:fixed;z-index:20;top:72px;width:40px;height:36px;border:0;background:rgba(40,60,80,.75);display:grid;place-items:center}
.ibtn svg{width:18px;height:18px}
#menuBtn{left:10px}
/* ---- prompt card ---- */
#card{position:fixed;z-index:14;top:150px;left:12px;right:12px;margin:0 auto;max-width:740px;background:var(--panel);padding:18px 20px 14px;
  border:1px solid #1e3550;box-shadow:0 0 0 1px rgba(0,0,0,.4),0 14px 40px -20px #000}
#card.in{animation:glitch .9s steps(1) both}
#card.out{animation:fadeout .45s ease forwards}
@keyframes glitch{0%{opacity:0;clip-path:inset(0 0 100% 0)}20%{opacity:1;clip-path:inset(0 0 60% 0);transform:translateX(-6px)}40%{clip-path:inset(30% 0 20% 0);transform:translateX(5px)}60%{clip-path:inset(0 0 10% 0);transform:none}80%{opacity:.6}100%{opacity:1;clip-path:inset(0)}}
@keyframes fadeout{to{opacity:0;transform:translateY(-10px)}}
#card .lab{font-size:10px;color:var(--pink)}
#qText{font-size:clamp(20px,3.4vw,30px);font-weight:600;line-height:1.35;margin:6px 0 8px;text-shadow:0 0 8px rgba(200,230,255,.25)}
#card .sub{font-size:11px;color:var(--muted);letter-spacing:.08em}
/* ---- bottom bar ---- */
#bar{position:fixed;z-index:15;left:0;right:0;bottom:0;padding:12px 12px 14px;background:linear-gradient(transparent,rgba(5,10,20,.92) 30%);transition:transform .45s cubic-bezier(.4,0,.2,1)}
#bar.hide{transform:translateY(110%)}
.barrow{display:flex;gap:10px;align-items:center;max-width:900px;margin:0 auto}
.ring{flex:none;width:56px;height:56px;position:relative}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font:700 17px "JetBrains Mono",monospace;color:var(--cyan)}
.ring.low b{color:var(--pink)}
#gIn{flex:1;height:52px;background:#0b1626;border:2px solid var(--cyan);color:var(--ink);font:16px "JetBrains Mono",monospace;padding:0 14px;border-radius:0}
#gIn:focus{outline:0;box-shadow:0 0 14px rgba(95,227,238,.35)}
#gIn:disabled{opacity:.5}
.dive{height:52px;padding:0 22px;border:0;background:var(--pink);color:#2a0716;font:700 14px Silkscreen,monospace;letter-spacing:.2em;box-shadow:0 4px 0 #a81f52;transition:transform .1s,box-shadow .1s}
.dive:active{transform:translateY(3px);box-shadow:0 1px 0 #a81f52}
.dive:disabled{background:#6b2a46;color:#c58aa2;box-shadow:none}
.air{max-width:900px;margin:8px auto 0;padding-left:66px}
.air i{display:block;height:3px;background:var(--cyan);transform-origin:left;box-shadow:0 0 8px var(--cyan)}
.ring.low~* ,.air.low i{background:var(--pink);box-shadow:0 0 8px var(--pink)}
#hintBox{position:fixed;z-index:15;left:50%;transform:translateX(-50%);bottom:96px;background:var(--panel);padding:10px 18px;text-align:center;
  border:1px solid #1e3550;display:none;max-width:min(92vw,620px)}
#hintBox.show{display:block;animation:pop .25s ease-out}
@keyframes pop{from{opacity:0;transform:translate(-50%,8px)}}
#hintBox .big{font-size:15px}
#hintBox .big em{font-style:normal;color:var(--cyan)}
#hintBox small{display:block;font-size:11px;color:var(--muted);margin-top:2px}
#hintBox.err .big{color:#ffb35c}
.shake{animation:sh .38s}
@keyframes sh{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
#countdown{position:fixed;z-index:15;left:0;right:0;bottom:34px;text-align:center;font-size:13px;letter-spacing:.14em;color:var(--muted);display:none}
#countdown b{color:var(--cyan)}
/* ---- sink pill + reveal ---- */
#pill{position:fixed;z-index:13;left:50%;top:40%;transform:translate(-50%,-50%);background:rgba(20,26,40,.9);padding:10px 18px;text-align:center;font:700 18px "JetBrains Mono",monospace;
  letter-spacing:.06em;color:var(--tc);text-shadow:0 0 10px var(--tc);display:none;width:max-content;max-width:min(86vw,640px);overflow-wrap:anywhere}
#pill.show{display:block;animation:pillin .6s ease-out}
@keyframes pillin{from{opacity:0;transform:translate(-50%,-30%)}}
#reveal{position:fixed;z-index:16;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;
  background:radial-gradient(circle at 50% 42%,rgba(3,6,12,.55),rgba(3,6,12,.85) 65%)}
#reveal.show{display:flex}
#rvIcon{height:64px;display:grid;place-items:center;animation:float 2.6s ease-in-out infinite;filter:drop-shadow(0 0 12px var(--tc))}
@keyframes float{50%{transform:translateY(-8px)}}
#rvTier{font-size:clamp(26px,6vw,46px);color:var(--tc);text-shadow:0 0 18px var(--tc);margin:14px 0 10px;letter-spacing:.22em}
#rvTier .wd{display:inline-block;white-space:nowrap}
#rvTier i{font-style:normal;display:inline-block;animation:flick .7s steps(2) both}
@keyframes flick{0%{opacity:0}40%{opacity:1}60%{opacity:.2}100%{opacity:1}}
#rvAns{font-size:18px}
#rvPts{font-size:17px;margin-top:10px;font-weight:700}
#rvPts em{font-style:normal;color:var(--tc)}
#rvLine{font-size:12px;color:var(--muted);letter-spacing:.08em;margin-top:10px}
.reveal-in>*{animation:up .6s ease-out both}
.reveal-in>*:nth-child(2){animation-delay:.15s}.reveal-in>*:nth-child(3){animation-delay:.85s}.reveal-in>*:nth-child(4){animation-delay:1.15s}.reveal-in>*:nth-child(5){animation-delay:1.45s}
@keyframes up{from{opacity:0;transform:translateY(12px)}}
.go{position:fixed;z-index:17;left:50%;bottom:22px;transform:translateX(-50%);min-width:210px;height:58px;background:rgba(10,16,28,.9);border:2px solid var(--pink);
  font:700 15px Silkscreen,monospace;letter-spacing:.22em;box-shadow:0 0 18px rgba(255,79,139,.35);display:none;animation:glow 1.6s ease-in-out infinite}
.go.show{display:block}
@keyframes glow{50%{box-shadow:0 0 30px rgba(255,79,139,.7)}}
/* ---- start / checking / results / setup overlays ---- */
.ov{position:fixed;z-index:25;inset:0;display:none}
.ov.show{display:flex}
#start{flex-direction:column;align-items:center;justify-content:flex-start;padding-top:16vh;text-align:center}
#start h1{font:clamp(34px,8vw,64px) Silkscreen,monospace;letter-spacing:.12em;margin:0;color:#173550;text-shadow:3px 3px 0 rgba(255,255,255,.6)}
#start p{color:#2a4a66;margin:10px 0 0;font-size:13px;letter-spacing:.1em}
#start .btns{position:fixed;bottom:25vh;left:0;right:0;display:flex;flex-direction:column;align-items:center;gap:12px}
.bigbtn{min-width:240px;height:60px;border:0;background:var(--pink);color:#2a0716;font:700 18px Silkscreen,monospace;letter-spacing:.24em;box-shadow:0 5px 0 #a81f52;animation:glow 1.6s ease-in-out infinite}
.textbtn{background:none;border:0;color:var(--ink);font:12px Silkscreen,monospace;letter-spacing:.2em;padding:10px;text-shadow:0 1px 3px #000}
#checking{align-items:center;justify-content:center;flex-direction:column;gap:24px;background:#070b14}
#checking p{font:13px Silkscreen,monospace;letter-spacing:.35em;color:var(--ink);margin:0}
#checking .k{animation:bob 1.2s ease-in-out infinite;filter:drop-shadow(0 0 10px rgba(255,60,90,.9))}
#surfaceBtn{z-index:27}
#results{background:#060a12;overflow:auto;display:none;justify-content:center}
#results.show{display:flex}
.res{width:min(640px,100%);padding:70px 20px 120px}
.res header{display:flex;justify-content:space-between;align-items:center;font-size:12px}
.res header .px{font-size:14px}
.res header span{color:var(--muted);font:10px Silkscreen,monospace;letter-spacing:.2em}
.bigscore{display:flex;align-items:baseline;gap:14px;margin:26px 0 4px;flex-wrap:wrap}
.bigscore b{font:700 clamp(54px,12vw,84px) "JetBrains Mono",monospace;line-height:1}
.bigscore span{color:var(--muted);font-size:14px}
.verdict{color:var(--cyan);font:12px Silkscreen,monospace;letter-spacing:.2em;margin:8px 0 34px}
.sec{display:flex;align-items:center;gap:12px;font:11px Silkscreen,monospace;letter-spacing:.2em;color:var(--muted);margin:30px 0 12px}
.sec::after{content:"";flex:1;border-top:1px dashed #2a3d52}
.sec em{font-style:normal;color:#5b738a}
.log{position:relative;height:300px}
.log svg{position:absolute;inset:0;width:100%;height:100%}
.band{display:grid;grid-template-columns:32px 92px minmax(0,1fr);gap:10px;align-items:center;padding:8px 6px;font-size:13px;color:var(--muted);border-left:2px solid transparent}
.band.me{color:var(--ink);border-left-color:var(--tc);background:rgba(255,255,255,.04)}
.band b{font-weight:400;white-space:nowrap}
#setup{background:rgba(4,8,14,.82);justify-content:center;overflow:auto}
.panel{width:min(720px,100%);margin:auto;background:#0c1626;border:1px solid #1e3550;padding:24px}
.panel h2{font:20px Silkscreen,monospace;letter-spacing:.14em;margin:0}
.panel p{color:var(--muted);font-size:13px;margin:6px 0 0}
.opts{display:flex;gap:18px;flex-wrap:wrap;margin:18px 0}
.panel label{display:block;font:10px Silkscreen,monospace;letter-spacing:.2em;color:var(--muted);margin:12px 0 6px}
.panel input[type=text],.panel select{width:100%;height:46px;background:#081120;border:1.5px solid #2a4560;color:var(--ink);font:16px "JetBrains Mono",monospace;padding:0 12px;border-radius:0}
.panel select{width:auto}
.panel input:focus,.panel select:focus{border-color:var(--cyan);outline:0}
.step{display:flex;border:1.5px solid #2a4560;width:max-content}
.step button{width:44px;height:44px;border:0;background:#081120;font:700 20px "JetBrains Mono",monospace}
.step input{width:52px;height:44px;border:0;background:#081120;color:var(--ink);text-align:center;font:700 17px "JetBrains Mono",monospace;-moz-appearance:textfield}
.step input::-webkit-inner-spin-button{-webkit-appearance:none}
.qs{display:grid;gap:10px}
.qc{border:1px solid #1e3550;padding:12px 14px;background:#0a1322}
.qc b{font:11px Silkscreen,monospace;letter-spacing:.2em;color:var(--pink)}
.two{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:0 12px}
.two select{width:100%}
.err{color:#ffb35c;font-size:13px;min-height:1.4em;margin-top:10px}
.row{display:flex;gap:12px;flex-wrap:wrap;margin-top:16px}
@media(max-width:560px){.two{grid-template-columns:minmax(0,1fr)}.fact{right:56px;font-size:11px}.meter{min-width:80px}.meter b{font-size:17px}}
</style>
</head>
<body>
<div id="stage"><div id="world"></div></div>
<canvas id="snow"></canvas>
<div class="vig" id="vig"></div>
<div class="scan"></div>

<div id="krill" class="away" aria-hidden="true"></div>

<div class="hud">
  <div class="meter notch"><small>Depth</small><b id="depthV">0m</b></div>
  <div class="mid"><div class="squares" id="squares"></div><small id="progV">Prompt 1 of 3</small></div>
  <div class="meter notch r"><small>Score</small><b id="scoreV">0</b></div>
</div>
<button class="ibtn" id="menuBtn" aria-label="Edit prompts"><svg viewBox="0 0 18 18"><path d="M2 4h14M2 9h14M2 14h14" stroke="#cfe0ec" stroke-width="2"/></svg></button>

<section id="card" hidden>
  <div class="lab px" id="cardLab">Prompt 1 of 3</div>
  <div id="qText"></div>
  <div class="sub">▼ rarer answers sink deeper ▼</div>
</section>

<div id="hintBox" role="status"><div class="big" id="hintBig"></div><small id="hintSmall"></small></div>
<div id="countdown">descending · the clock starts in <b id="cdN">3</b></div>

<div id="bar" class="hide">
  <form class="barrow" id="guessForm" novalidate>
    <div class="ring" id="ring"><svg viewBox="0 0 56 56"><circle cx="28" cy="28" r="24" fill="#0b1626" stroke="#1d3349" stroke-width="3"/>
      <circle id="ringArc" cx="28" cy="28" r="24" fill="none" stroke="#5fe3ee" stroke-width="3" stroke-dasharray="150.8" stroke-dashoffset="0"/></svg><b id="ringN">25</b></div>
    <input id="gIn" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="type one answer…" aria-label="Your answer">
    <button class="dive" id="goBtn" type="submit">Dive</button>
  </form>
  <div class="air" id="air"><i id="airBar"></i></div>
</div>

<div id="pill"></div>
<div id="reveal" aria-live="polite"><div id="rvBox" style="display:flex;flex-direction:column;align-items:center">
  <div id="rvIcon"></div><div id="rvTier" class="px"></div><div id="rvAns"></div><div id="rvPts"></div><div id="rvLine"></div></div></div>
<button class="go" id="goNext">Descend ▼</button>

<!-- start -->
<div class="ov show" id="start">
  <h1>Deep Dive</h1>
  <p id="startSub"></p>
  <div class="btns">
    <button class="bigbtn" id="beginBtn">Begin dive</button>
  </div>
</div>

<div class="ov" id="checking"><p>Checking your result…</p><div class="k" id="ckKrill"></div></div>

<div class="ov" id="results"><div class="res">
  <header><span class="px">Deep Dive</span><span>Dive complete</span></header>
  <div class="bigscore"><b id="rsScore">0</b><span id="rsOf"></span></div>
  <div class="verdict" id="rsVerdict"></div>
  <div class="sec">Dive log <em>deeper = rarer</em></div>
  <div class="log"><svg id="logSvg"></svg></div>
  <div class="sec">The bearing</div>
  <div id="bands"></div>
</div></div>
<button class="go" id="surfaceBtn">Surface ▲</button>

<!-- setup -->
<div class="ov" id="setup"><div class="panel">
  <h2>Build your dive</h2>
  <p>Each prompt gets one accepted answer and a rarity.</p>
  <form id="setupForm" novalidate>
    <div class="opts">
      <div><label id="cLbl">Prompts</label>
        <div class="step" role="group" aria-labelledby="cLbl">
          <button type="button" id="minus" aria-label="Fewer prompts">−</button>
          <input type="number" id="countIn" min="1" max="20" inputmode="numeric" aria-label="Number of prompts">
          <button type="button" id="plus" aria-label="More prompts">+</button></div></div>
      <div><label for="timeIn">Seconds per prompt</label>
        <select id="timeIn"><option value="0">No timer</option><option value="15">15</option><option value="25">25</option><option value="45">45</option></select></div>
    </div>
    <div class="qs" id="qs"></div>
    <div class="err" id="setupErr"></div>
    <div class="row"><button class="bigbtn" type="submit" style="animation:none">Save</button></div>
  </form>
</div></div>

<script>
{
  // ================= config =================
  const TIERS = [
    {name:'Plankton',          pts:10,  c:'#dfe9f2', icon:'plank', line:'The first answer most people reach for.'},
    {name:'Too Clever',        pts:15,  c:'#ffb648', icon:'bulb',  line:'The famous “obscure” pick. Everyone thought of it.'},
    {name:'Schooler',          pts:30,  c:'#5fe3ee', icon:'fish',  line:'You swam with a smaller crowd.'},
    {name:'Rare',              pts:60,  c:'#ff4e5e', icon:'squid', line:'Hardly anyone says that one.'},
    {name:'Deep Cut',          pts:85,  c:'#a993ff', icon:'angler',line:'Down where the light gives up.'},
    {name:'One in a Krillion', pts:100, c:'#ffd84a', icon:'gold', line:'Nobody else got there.'}
  ];
  const M_PER_PT = 10, S = 2;           // metres per point, pixels per metre
  const TOLERANCE = 0.2, MAX_Q = 20;
  const FACTS = [[200,'most sunlight stops here'],[332,'deepest scuba dive ever · 332m'],[1000,'the midnight zone begins'],
    [2000,'sperm whales hunt down here'],[3800,'the Titanic rests here'],[6000,'the hadal zone begins'],[10935,'Challenger Deep · the bottom']];
  const SAMPLE = [
    {q:'Name a country with the letter B in its name.', a:'Gambia', t:1},
    {q:'Name a fictional weapon.', a:'Ultraviolet Power Ring', t:4},
    {q:'Name a job focused on repairing physical things.', a:'Electrician', t:0}
  ];
  const $ = id => document.getElementById(id);
  const fmt = n => Math.round(n).toLocaleString('en-US');
  const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

    $('rvAns').textContent = `“${p.a}”`;
    $('rvPts').innerHTML = ok ? `<em>+${t.pts} PTS</em> · sink ${fmt(t.pts * M_PER_PT)}m` : `<em>+0 PTS</em> · the answer was ${esc(TIERS[p.t].name)}`;
    $('rvLine').textContent = ok ? t.line : 'The clock ran out before you dove.';
    const box = $('rvBox'); box.className = ''; void box.offsetWidth; box.className = 'reveal-in';
    $('reveal').classList.add('show');
    const last = idx === prompts.length - 1;
    const go = $('goNext'); go.textContent = last ? 'Surface ▲' : 'Descend ▼';
    await wait(1600); go.classList.add('show');
    go.focus();
    busy = false;
  }

  $('goNext').addEventListener('click', async () => {
    if (busy) return;
    $('reveal').classList.remove('show'); $('goNext').classList.remove('show');
    $('tlines').innerHTML = '';
    mode = 'play';
    if (idx < prompts.length - 1){ idx++; loadPrompt(); }
    else showResults();
  });

  // ================= results =================
  async function showResults(){
    busy = true; mode = 'results'; drawSquares();
    showOv('checking', true);
    await wait(2200);
    showOv('checking', false);
    const n = prompts.length, s = score(), avg = s / n;
    const tierIdx = TIERS.reduce((best, tt, i) => avg >= tt.pts ? i : best, -1);
    $('rsOf').textContent = `/ ${fmt(n * 100)} pts · ${fmt(s * M_PER_PT)}m deep`;
    $('rsVerdict').textContent = s === n * 100 ? 'Perfect dive. One in a krillion, every time.' :
      results.every(r => !r.ok) ? 'Back at the surface. Every answer slipped away.' :
      `You dove like a ${tierIdx >= 0 ? TIERS[tierIdx].name.toLowerCase() : 'plankton'}.`;
    showOv('results', true);
    $('results').scrollTop = 0;
    // count up
    const el = $('rsScore'), t0 = performance.now();
    const step = now => { const k = Math.min(1, (now - t0) / 2400), e = 1 - Math.pow(1 - k, 3); el.textContent = fmt(s * e); if (k < 1) requestAnimationFrame(step); };
    requestAnimationFrame(step);
    drawLog();
    // bearing bands
    const bands = TIERS.map((tt, i) => {
      const lo = i === 0 ? 0 : tt.pts * n, hi = i < TIERS.length - 1 ? TIERS[i+1].pts * n - 1 : n * 100;
      return {tt, lo, hi, i};
    });
    bands[TIERS.length - 1].lo = n * 100;
    const meI = bands.reduce((b, x) => s >= x.lo ? x.i : b, 0);
    $('bands').innerHTML = bands.map(b => `<div class="band${b.i === meI ? ' me' : ''}" style="--tc:${b.tt.c}">
      ${spriteH(b.tt.icon, 26)}<b>${b.lo === b.hi ? fmt(b.lo) : fmt(b.lo) + '–' + fmt(b.hi)}</b><span>${b.tt.name}. ${b.tt.line}</span></div>`).join('');
    $('surfaceBtn').classList.add('show');
    busy = false;
  }
  function drawLog(){
    const svg = $('logSvg'), Wd = svg.clientWidth || 600, Hd = svg.clientHeight || 300;
    const n = prompts.length, padL = 34, padB = 24, top = 10, h = Hd - padB - top, col = (Wd - padL) / n;
    let g = '';
    [0, 25, 50, 75, 100].forEach(v => {
      const yy = top + h * v / 100;
      g += `<line x1="${padL}" x2="${Wd}" y1="${yy}" y2="${yy}" stroke="#1c2b3c" stroke-dasharray="${v ? '2 4' : '0'}"/>
        <text x="${padL - 6}" y="${yy + 3}" text-anchor="end" fill="#5b738a" font-size="9" font-family="JetBrains Mono">${v ? '-' + v : '0m'}</text>`;
    });
    prompts.forEach((p, i) => {
      const r = results[i], x = padL + col * (i + .5), ok = r && r.ok, tt = TIERS[p.t];
      const yy = top + h * (ok ? tt.pts : 0) / 100, c = ok ? tt.c : '#56677a', delay = .6 + i * .45;
      g += `<text x="${x}" y="${Hd - 6}" text-anchor="middle" fill="#5b738a" font-size="10" font-family="JetBrains Mono">${i+1}</text>`;
      if (ok){
        g += `<line x1="${x}" x2="${x}" y1="${top}" y2="${yy}" stroke="${c}" stroke-opacity=".55" stroke-width="1.5"
          stroke-dasharray="${h}" stroke-dashoffset="${h}" style="animation:draw 1.6s ${delay}s ease-out forwards"/>`;
        const sp = SPR[tt.icon].rows, ps = 24 / Math.max(sp.length, ...sp.map(r => r.length)), pw = Math.max(...sp.map(r => r.length)) * ps, ph = sp.length * ps;
        g += `<g style="opacity:0;animation:fadein .6s ${delay + 1.5}s forwards;filter:drop-shadow(0 0 4px ${c})" transform="translate(${x - pw/2} ${yy - ph/2})">${
          spriteH(tt.icon, 24).replace('<svg ', '<svg x="0" y="0" ')}</g>`;
      } else {
        g += `<text x="${x}" y="${top + 16}" text-anchor="middle" fill="#56677a" font-size="10" font-family="JetBrains Mono">×</text>`;
      }
    });
    svg.setAttribute('viewBox', `0 0 ${Wd} ${Hd}`);
    svg.innerHTML = `<style>@keyframes draw{to{stroke-dashoffset:0}}@keyframes fadein{to{opacity:1}}</style>` + g;
  }

  $('surfaceBtn').addEventListener('click', async () => {
    if (busy) return; busy = true;
    showOv('results', false); $('surfaceBtn').classList.remove('show');
    mode = 'surfacing';
    puff(60, innerWidth / 2, innerHeight, innerWidth);
    $('krill').classList.add('away');
    await tweenCam(startCam(), Math.min(9000, 3000 + depth * 1.2));
    mode = 'start'; anchor(); cam = startCam(); placeCam();
    idx = 0; results = []; depth = 0; drawSquares();
    $('scoreV').dataset.v = 0; $('scoreV').textContent = '0'; setDepthHud(0);
    startSub(); showOv('start', true);
    busy = false;
  });

  // ================= setup =================
  const tierOpts = sel => TIERS.map((t, i) => `<option value="${i}"${i===sel?' selected':''}>${t.name} · ${t.pts}</option>`).join('');
  function drawSetup(){
    $('countIn').value = prompts.length;
    $('minus').disabled = prompts.length <= 1; $('plus').disabled = prompts.length >= MAX_Q;
    $('timeIn').value = String(airSecs);
    $('qs').innerHTML = prompts.map((p, i) => `
      <div class="qc" data-i="${i}"><b>Prompt ${i+1}</b>
        <label for="q${i}">Question</label>
        <input type="text" id="q${i}" data-f="q" autocomplete="off" value="${esc(p.q)}" placeholder="Name a type of cheese.">
        <div class="two">
          <div><label for="a${i}">The one accepted answer</label><input type="text" id="a${i}" data-f="a" autocomplete="off" value="${esc(p.a)}" placeholder="Gruyère"></div>
          <div><label for="t${i}">Rarity</label><select id="t${i}" data-f="t">${tierOpts(p.t)}</select></div>
        </div></div>`).join('');
  }
  function setCount(n){
    n = Math.max(1, Math.min(MAX_Q, Math.round(+n) || 1));
    while (prompts.length < n) prompts.push({q:'', a:'', t:0});
    prompts.length = n; drawSetup(); save();
  }
  $('minus').addEventListener('click', () => setCount(prompts.length - 1));
  $('plus').addEventListener('click', () => { setCount(prompts.length + 1); $('q' + (prompts.length - 1)).focus(); });
  $('countIn').addEventListener('change', e => setCount(e.target.value));
  $('timeIn').addEventListener('change', e => { airSecs = +e.target.value; save(); });
  $('qs').addEventListener('input', e => {
    const f = e.target.dataset.f; if (!f) return;
    const i = +e.target.closest('.qc').dataset.i;
    prompts[i][f] = f === 't' ? +e.target.value : e.target.value; save();
  });
  function openSetup(){
    if (busy && mode !== 'start') return;
    stopTimer();
    drawSetup(); showOv('setup', true); $('setupErr').textContent = '';
  }
  $('setupForm').addEventListener('submit', e => {
    e.preventDefault();
    const bad = prompts.findIndex(p => !p.q.trim() || !normalize(p.a || ''));
    if (bad >= 0){ $('setupErr').textContent = `Prompt ${bad+1} needs both a question and an answer.`; $(prompts[bad].q.trim() ? 'a'+bad : 'q'+bad).focus(); return; }
    showOv('setup', false);
    // return to the surface with the new prompts
    $('card').hidden = true; $('bar').classList.add('hide'); $('reveal').classList.remove('show'); $('goNext').classList.remove('show');
    showOv('results', false); $('surfaceBtn').classList.remove('show'); hint(null); $('countdown').style.display = 'none';
    mode = 'start'; busy = false; anchor(); cam = startCam(); $('krill').classList.add('away'); idx = 0; results = []; depth = 0;
    $('scoreV').dataset.v = 0; $('scoreV').textContent = '0'; setDepthHud(0);
    buildWorld(); placeCam(); drawSquares(); startSub(); showOv('start', true);
  });
  $('menuBtn').addEventListener('click', openSetup);
  $('beginBtn').addEventListener('click', begin);
  addEventListener('keydown', e => { if (e.key === 'Escape' && $('setup').classList.contains('show') && !prompts.some(p => !p.q.trim() || !normalize(p.a||''))) $('setupForm').requestSubmit(); });

  // ================= boot =================
  buildWorld(); size(); addEventListener('resize', size);
  drawSquares(); startSub();
  requestAnimationFrame(frame);
}
</script>
</body>
</html>
